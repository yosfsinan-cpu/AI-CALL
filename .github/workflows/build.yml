name: Build iOS IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare App Payload Structure & Assets
      run: |
        mkdir -p Payload/YuseefAI.app
        cp index.html Payload/YuseefAI.app/
        
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/YuseefAI.app/
        fi
        
        # دروستکرنا فایلەکێ مەزنتر (Dummy File) دا قەبارێ ئەپێ بگەهیتە دەوروبەرا 6 مێگابایتی
        dd if=/dev/zero of=Payload/YuseefAI.app/assets_pack.bin bs=1m count=6

    - name: Package into .ipa format
      run: |
        cd Payload
        zip -r ../yuseef_ai.ipa YuseefAI.app
        cd ..

    - name: Upload Generated IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YuseefAI-IPA
        path: yuseef_ai.ipa
