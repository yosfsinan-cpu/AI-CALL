name: Build iOS IPA

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Prepare App Payload Structure
      run: |
        mkdir -p Payload/YuseefAI.app
        # ڤەگوهاستنا index.html بۆ ناڤ پەیلوودا ئەپی
        cp index.html Payload/YuseefAI.app/
        
        # ڤەگوهاستنا Info.plist یا تە بۆ ناڤ پەیلوودێ دا ڤێرژن و مێتاپەیدا کار بکەن
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/YuseefAI.app/
        fi

    - name: Package into .ipa format
      run: |
        cd Payload
        zip -r ../yuseef_ai.ipa YuseefAI.app
        cd ..

    - name: Upload Generated IPA Artifact
      uses: actions/upload-artifact@v3
      with:
        name: YuseefAI-IPA
        path: yuseef_ai.ipa
